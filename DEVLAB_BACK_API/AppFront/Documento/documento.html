<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <title>Gestão de Documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css" />
</head>
<body>
    <h1>Gestão de Documentos</h1>
    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente"/>
        <input type="file" id="arquivo" />
        <button id="btEviar" onclick="enviarDocumento()">Enviar</button>
        <button id="btBuscar" onclick="buscarDocumentos()">Buscar Documentos</button>
    </div>
    <div class="table-conteiner">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Extensão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaDocumentos">

            </tbody>
        </table>
    </div>
    <script src="documento.js"></script>
</body>
</html>
